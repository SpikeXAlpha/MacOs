name: MacOS VNC via Tailscale

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
        # NOTE: apne purane Tailscale step ke inputs yahan rakhna agar alag the

      - name: Enable VNC (legacy password, RealVNC compatible)
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}   # EXACTLY 8 chars, legacy VNC limit
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: |
          sudo dscl . -passwd /Users/runner "$USER_PASSWORD"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -restart -agent -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASSWORD"

      - name: Try Screen Recording permission (best effort, usually blocked by SIP)
        run: |
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','/usr/libexec/screensharingd',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));"  echo "TCC write blocked (SIP)"

      - name: Show connection info
        run: |
          echo "Tailscale IP: $(tailscale ip -4)"
          sudo lsof -iTCP:5900 -sTCP:LISTEN  echo "5900 not listening"

      - name: Keep alive
        run: sleep 21000
