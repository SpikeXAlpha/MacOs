name: MacOS VNC via Tailscale

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner image
        type: choice
        default: macos-15
        options:
          - macos-14
          - macos-15
          - macos-latest

jobs:
  build:
    name: MacVNC
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360

    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: mac-runner
        # NOTE: tumhare purane working Tailscale step ke inputs yahan rakh sakte ho

      - name: Enable VNC (old working method, ngrok removed)
        run: |
          sudo mdutil -i off -a

          # new admin account
          sudo dscl . -create /Users/runneradmin
          sudo dscl . -create /Users/runneradmin UserShell /bin/bash
          sudo dscl . -create /Users/runneradmin RealName Runner_Admin
          sudo dscl . -create /Users/runneradmin UniqueID 1001
          sudo dscl . -create /Users/runneradmin PrimaryGroupID 80
          sudo dscl . -create /Users/runneradmin NFSHomeDirectory /Users/runneradmin
          sudo dscl . -passwd /Users/runneradmin 'P@ssw0rd!'
          sudo createhomedir -c -u runneradmin > /dev/null
          sudo dscl . -append /Groups/admin GroupMembership runneradmin

          # enable VNC with legacy password
          K=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo $K -activate -configure -allowAccessFor -allUsers -privs -all
          sudo $K -configure -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw runnerrd
          python3 -c "import sys; k=bytes.fromhex('1734516E8BA8C5E2FF1C39567390ADCA'); p=sys.argv[1][:8].encode(); print(''.join('%02X'%(k[i]^(p[i] if i<len(p) else 0)) for i in range(16)))" runnerrdp | sudo tee /Library/Preferences/com.apple.VNCSettings.txt
          sudo $K -restart -agent -console
          sudo $K -activate

      - name: Grant Screen Recording permission (TCC, best effort)
        run: |
          set +e
          NOW=$(date +%s)
          SQL=""
          for SVC in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceListenEvent kTCCServiceAccessibility; do
            for CL in com.apple.screensharing.agent com.apple.RemoteDesktop.agent com.apple.screensharing.MessagesAgent /usr/libexec/screensharingd /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/MacOS/ARDAgent /bin/bash; do
              TYPE=0
              case "$CL" in /*) TYPE=1;; esac
              SQL="$SQL INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags,last_modified) VALUES ('$SVC','$CL',$TYPE,2,4,1,'UNUSED',0,$NOW);"
            done
          done
          for DB in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            echo "== $DB"
            sudo sqlite3 "$DB" "$SQL"
            echo "write exit code: $?"
            sudo sqlite3 "$DB" "select service,client,auth_value from access where service='kTCCServiceScreenCapture';"
          done
          sudo killall tccd
          sudo killall screensharingd
          K=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo $K -restart -agent -console
          true

      - name: Connection details
        run: |
          echo "=========================================="
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "VNC address : $(tailscale ip -4):5900"
          echo "VNC password: runnerrdp"
          echo "Username    : runneradmin"
          echo "Password    : P@ssw0rd!"
          echo "=========================================="
          if sudo lsof -iTCP:5900 -sTCP:LISTEN; then echo "5900 listening"; else echo "5900 NOT listening"; fi

      - name: Wake display and debug
        run: |
          set +e
          sw_vers
          echo "console user: $(stat -f%Su /dev/console)"
          sudo pmset -a displaysleep 0 sleep 0
          caffeinate -u -t 5
          sudo launchctl list | grep -i screensharing
          true

      - name: Keep alive (display awake)
        run: caffeinate -dimsu sleep 21000
